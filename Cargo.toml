[package]
name = "cargo-unused"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/x-at-01/cargo-unused"
categories = ["development-tools::cargo-plugins"]
description = "Detect unused pub methods in a Rust workspace"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
duct = "1.1.2"
env_logger = "0.11.11"
itertools = "0.15.0"
log = "0.4.35"
protobuf = "=3.7.2"
scip = "0.10.0"
walkdir = "2.5.0"
